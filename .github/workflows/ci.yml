# The gates themselves live in the Makefile. This file's only job is to say
# where they run and on what, so that every check it performs is one a
# contributor can run first with `make`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: macos
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # isu check measures a branch from where it left trunk, and a shallow
          # clone has no merge base to measure from.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint is pinned by the Makefile and installed through it, rather
      # than by an action that would pin the version somewhere else as well.
      - run: make tools

      - run: make build
      - run: make vet
      - run: make lint
      - run: make test

      # M2-S5's wall-clock budgets are asserted here and nowhere else: a figure
      # taken while `go test ./...` runs another package's git beside it is a
      # measurement of the runner, not of the read path. This step has the
      # machine to itself.
      - run: make perf

      - run: make cover

      # M5-S7: the rules this project builds, run over the project that builds
      # them. On a pull request the base branch is fetched by name and named as
      # trunk — the checkout is a merge commit and no branch, so without it isu
      # would compare the repository against itself and every rule about the
      # branch would pass silently.
      - name: dogfood
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch --quiet origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
            make dogfood ISU_CHECK_ARGS="--ref origin/$BASE"
          else
            make dogfood
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.name }}
          path: coverage.out
          if-no-files-found: ignore
