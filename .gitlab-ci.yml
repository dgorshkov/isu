# The mirror image of .github/workflows/ci.yml: same gates, same order, same
# Makefile. TestMakefileTargetsExist in scripts/ fails the build if either file
# grows a step the other cannot run.

stages:
  - gates

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request is already covered by the pipeline
    # above; without this the same commit is built twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.gates:
  stage: gates
  interruptible: true
  variables:
    # Keep the module cache inside the project so the cache below can carry it.
    GOPATH: $CI_PROJECT_DIR/.gopath
  cache:
    key: go-$CI_JOB_NAME
    paths:
      - .gopath/pkg/mod
  script:
    - make tools
    - make build
    - make vet
    - make lint
    - make test
    - make cover
  coverage: '/coverage: (\d+\.\d+)% of \d+ statements overall/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.out

linux:
  extends: .gates
  image: golang:1.23
  tags:
    - saas-linux-small-amd64

macos:
  extends: .gates
  image: macos-14-xcode-15
  tags:
    - saas-macos-medium-m1
